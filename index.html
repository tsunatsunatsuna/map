<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>住みやすさマップ Pro+ Custom</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --primary: #3498db;
      --bg-panel: rgba(255, 255, 255, 0.98);
      --text-main: #2c3e50;
    }
    body { margin: 0; font-family: "Helvetica Neue", Arial, sans-serif; overflow: hidden; background: #222; }
    #map { height: 100vh; width: 100vw; z-index: 1; }

    /* 駅検索バー */
    .search-container {
      position: absolute;
      top: 15px; left: 50%;
      transform: translateX(-50%);
      z-index: 1100;
      display: flex; gap: 8px;
      width: 320px;
    }
    #station-query {
      flex: 1; padding: 12px 20px;
      border-radius: 30px; border: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2); outline: none;
    }
    #search-btn {
      padding: 10px 20px; background: var(--primary);
      color: white; border: none; border-radius: 25px;
      cursor: pointer; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    /* 設定パネル */
    .control-panel {
      position: absolute;
      top: 15px; left: 15px;
      background: var(--bg-panel);
      width: 280px; max-height: 90vh;
      border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      z-index: 1000; display: flex; flex-direction: column;
    }
    .panel-header { padding: 15px 20px; border-bottom: 1px solid #eee; }
    .panel-header h2 { margin: 0 0 10px 0; font-size: 18px; color: var(--text-main); }
    
    /* マップテーマ切り替え */
    .theme-selector {
      display: flex; gap: 5px; margin-bottom: 5px;
    }
    .theme-btn {
      flex: 1; padding: 6px; font-size: 11px; border: 1px solid #ddd;
      border-radius: 4px; cursor: pointer; background: white;
    }
    .theme-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    .panel-content { padding: 10px 15px; overflow-y: auto; flex-grow: 1; }

    /* アコーディオン設定 */
    details { margin-bottom: 8px; border: 1px solid #eee; border-radius: 8px; overflow: hidden; }
    summary { 
      padding: 10px; background: #f8f9fa; cursor: pointer; 
      list-style: none; display: flex; align-items: center; font-weight: bold; font-size: 14px;
    }
    summary::-webkit-details-marker { display: none; }
    summary:hover { background: #f1f3f5; }
    
    .child-list { padding: 10px 15px; background: white; border-top: 1px solid #eee; }
    .child-label { display: flex; align-items: center; font-size: 13px; margin: 6px 0; cursor: pointer; }
    input[type="checkbox"] { margin-right: 10px; transform: scale(1.1); }
    .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }

    /* 実行ボタン */
    .panel-footer { padding: 15px; border-top: 1px solid #eee; }
    #refresh-btn {
      width: 100%; padding: 14px; background: var(--primary);
      color: white; border: none; border-radius: 8px;
      cursor: pointer; font-weight: bold; font-size: 14px;
    }
    #loading { font-size: 12px; color: #e67e22; text-align: center; margin-bottom: 8px; display: none; font-weight: bold; }
  </style>
</head>
<body>

<div class="search-container">
  <input type="text" id="station-query" placeholder="駅名や地名を入力">
  <button id="search-btn">検索</button>
</div>

<div class="control-panel">
  <div class="panel-header">
    <h2>🏠 住みやすさ設定</h2>
    <div class="theme-selector">
      <button class="theme-btn active" onclick="changeTheme('light', this)">ライト</button>
      <button class="theme-btn" onclick="changeTheme('dark', this)">ダーク</button>
      <button class="theme-btn" onclick="changeTheme('standard', this)">標準</button>
    </div>
  </div>
  
  <div class="panel-content">
    <details open>
      <summary><input type="checkbox" checked class="parent-check" data-cat="conv"> コンビニ</summary>
      <div class="child-list">
        <label class="child-label"><input type="checkbox" checked class="child-check" data-cat="conv" data-key="seven"> <span class="dot" style="background:#2e7d32"></span> セブン</label>
        <label class="child-label"><input type="checkbox" checked class="child-check" data-cat="conv" data-key="lawson"> <span class="dot" style="background:#1976d2"></span> ローソン</label>
        <label class="child-label"><input type="checkbox" checked class="child-check" data-cat="conv" data-key="famima"> <span class="dot" style="background:#66bb6a"></span> ファミマ</label>
      </div>
    </details>

    <details>
      <summary><input type="checkbox" checked class="parent-check" data-cat="food"> チェーン店</summary>
      <div class="child-list">
        <label class="child-label"><input type="checkbox" checked class="child-check" data-cat="food" data-key="mcd"> <span class="dot" style="background:#d32f2f"></span> マック</label>
        <label class="child-label"><input type="checkbox" checked class="child-check" data-cat="food" data-key="matsuya"> <span class="dot" style="background:#f57c00"></span> 松屋</label>
        <label class="child-label"><input type="checkbox" checked class="child-check" data-cat="food" data-key="saizeriya"> <span class="dot" style="background:#bf360c"></span> サイゼリヤ</label>
      </div>
    </details>

    <details>
      <summary><input type="checkbox" checked class="parent-check" data-cat="life"> 生活</summary>
      <div class="child-list">
        <label class="child-label"><input type="checkbox" checked class="child-check" data-cat="life" data-key="muji"> <span class="dot" style="background:#4a148c"></span> 無印良品</label>
        <label class="child-label"><input type="checkbox" checked class="child-check" data-cat="life" data-key="bookoff"> <span class="dot" style="background:#311b92"></span> ブックオフ</label>
      </div>
    </details>

    <details>
      <summary><input type="checkbox" checked class="parent-check" data-cat="public"> 公共施設</summary>
      <div class="child-list">
        <label class="child-label"><input type="checkbox" checked class="child-check" data-cat="public" data-key="library"> <span class="dot" style="background:#00796b"></span> 図書館</label>
        <label class="child-label"><input type="checkbox" checked class="child-check" data-cat="public" data-key="park"> <span class="dot" style="background:#4db6ac"></span> 公園</label>
      </div>
    </details>
  </div>
  
  <div class="panel-footer">
    <div id="loading">データ取得中...</div>
    <button id="refresh-btn">このエリアを再検索</button>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // ① 地図とテーマの設定
  const themes = {
    standard: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    light: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    dark: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
  };

  const map = L.map('map', { zoomControl: false }).setView([35.681236, 139.767125], 15);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  
  let currentTileLayer = L.tileLayer(themes.light).addTo(map);

  function changeTheme(themeKey, btn) {
    map.removeLayer(currentTileLayer);
    currentTileLayer = L.tileLayer(themes[themeKey]).addTo(map);
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

    lawson:   { color: "#1976d2", q: 'node["brand:en"="Lawson"]' },
    famima:   { color: "#66bb6a", q: 'node["brand:en"="FamilyMart"]' },
    mcd:      { color: "#d32f2f",
