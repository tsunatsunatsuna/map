<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>住みやすさマップ Pro+ (Stable V2)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --primary: #3498db;
      --bg-panel: rgba(255, 255, 255, 0.98);
      --text-main: #2c3e50;
    }
    
    /* 画面全体の固定 */
    html, body { 
      position: fixed; 
      width: 100%; 
      height: 100%; 
      margin: 0; 
      padding: 0; 
      overflow: hidden; 
      touch-action: none; /* ブラウザ独自のジェスチャーを制限 */
    }

    #map { 
      height: 100%; 
      width: 100%; 
      z-index: 1; 
      background: #eee;
    }

    /* UIレイヤー（地図の上に重なる要素をまとめる） */
    .ui-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; /* 下の地図を操作できるようにする */
      z-index: 1000;
    }
    .ui-layer > * { pointer-events: auto; } /* 中身は操作可能に */

    /* 検索バー - スマホでのズレを防止 */
    .search-container {
      position: absolute;
      top: 15px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 8px;
      width: 90%; max-width: 320px;
    }
    #station-query {
      flex: 1; padding: 12px 15px;
      border-radius: 30px; border: 1px solid #ccc;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      font-size: 16px !important; /* 絶対に16px */
      background: white;
      -webkit-appearance: none; /* iOSのデフォルトスタイル解除 */
    }
    #search-btn {
      padding: 0 18px; background: var(--primary);
      color: white; border: none; border-radius: 25px;
      font-weight: bold; font-size: 14px;
    }

    /* 設定パネル - スマホで検索バーの下に来るように調整 */
    .control-panel {
      position: absolute;
      top: 80px; left: 10px;
      background: var(--bg-panel);
      width: calc(100% - 20px); max-width: 280px;
      max-height: 60vh;
      border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      display: flex; flex-direction: column;
    }
    
    /* PC表示の時は横に並べる */
    @media (min-width: 768px) {
      .search-container { top: 15px; left: 310px; transform: none; }
      .control-panel { top: 15px; left: 15px; max-height: 90vh; }
    }

    .panel-header { padding: 12px 15px; border-bottom: 1px solid #eee; }
    .panel-header h2 { margin: 0 0 8px 0; font-size: 16px; }
    
    .theme-selector { display: flex; gap: 4px; }
    .theme-btn {
      flex: 1; padding: 8px 0; font-size: 11px; border: 1px solid #ddd;
      border-radius: 4px; background: white; cursor: pointer;
    }
    .theme-btn.active { background: var(--primary); color: white; }

    .panel-content { padding: 10px; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    details { margin-bottom: 5px; border: 1px solid #eee; border-radius: 6px; }
    summary { padding: 10px; background: #f8f9fa; font-weight: bold; font-size: 13px; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    summary input { margin-right: 8px; }
    
    .child-list { padding: 8px 10px; background: white; }
    .child-label { display: flex; align-items: center; font-size: 13px; margin: 8px 0; }
    .dot { height: 8px; width: 8px; border-radius: 50%; margin-right: 8px; }

    .panel-footer { padding: 10px; border-top: 1px solid #eee; }
    #refresh-btn {
      width: 100%; padding: 14px; background: var(--primary);
      color: white; border: none; border-radius: 8px; font-weight: bold;
    }
    #loading { font-size: 11px; color: #e67e22; text-align: center; display: none; margin-bottom: 5px; }
  </style>
</head>
<body>

<div id="map"></div>

<div class="ui-layer">
  <div class="search-container">
    <input type="text" id="station-query" placeholder="駅名を入力" inputmode="search">
    <button id="search-btn">検索</button>
  </div>

  <div class="control-panel">
    <div class="panel-header">
      <h2>🏠 住みやすさ設定</h2>
      <div class="theme-selector">
        <button class="theme-btn" data-theme="light">ライト</button>
        <button class="theme-btn" data-theme="dark">ダーク</button>
        <button class="theme-btn active" data-theme="standard">標準</button>
      </div>
    </div>
    
    <div class="panel-content">
      <details open>
        <summary><input type="checkbox" checked class="parent-check" data-cat="conv"> コンビニ</summary>
        <div class="child-list">
          <label class="child-label"><input type="checkbox" checked class="child-check" data-cat="conv" data-key="seven"> <span class="dot" style="background:#2e7d32"></span> セブン</label>
          <label class="child-label"><input type="checkbox" checked class="child-check" data-cat="conv" data-key="lawson"> <span class="dot" style="background:#1976d2"></span> ローソン</label>
          <label class="child-label"><input type="checkbox" checked class="child-check" data-cat="conv" data-key="famima"> <span class="dot" style="background:#66bb6a"></span> ファミマ</label>
        </div>
      </details>
      <details>
        <summary><input type="checkbox" checked class="parent-check" data-cat="food"> チェーン店</summary>
        <div class="child-list">
          <label class="child-label"><input type="checkbox" checked class="child-check" data-cat="food" data-key="mcd"> <span class="dot" style="background:#d32f2f"></span> マック</label>
          <label class="child-label"><input type="checkbox" checked class="child-check" data-cat="food" data-key="matsuya"> <span class="dot" style="background:#f57c00"></span> 松屋</label>
          <label class="child-label"><input type="checkbox" checked class="child-check" data-cat="food" data-key="saizeriya"> <span class="dot" style="background:#bf360c"></span> サイゼリヤ</label>
        </div>
      </details>
      <details>
        <summary><input type="checkbox" checked class="parent-check" data-cat="life"> 生活</summary>
        <div class="child-list">
          <label class="child-label"><input type="checkbox" checked class="child-check" data-cat="life" data-key="muji"> <span class="dot" style="background:#4a148c"></span> 無印良品</label>
          <label class="child-label"><input type="checkbox" checked class="child-check" data-cat="life" data-key="bookoff"> <span class="dot" style="background:#311b92"></span> ブックオフ</label>
        </div>
      </details>
      <details>
        <summary><input type="checkbox" checked class="parent-check" data-cat="public"> 公共施設</summary>
        <div class="child-list">
          <label class="child-label"><input type="checkbox" checked class="child-check" data-cat="public" data-key="library"> <span class="dot" style="background:#00796b"></span> 図書館</label>
          <label class="child-label"><input type="checkbox" checked class="child-check" data-cat="public" data-key="park"> <span class="dot" style="background:#4db6ac"></span> 公園</label>
        </div>
      </details>
    </div>
    
    <div class="panel-footer">
      <div id="loading">データ取得中...</div>
      <button id="refresh-btn">エリア内を再検索</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
