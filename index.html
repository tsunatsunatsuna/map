<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>住みやすさマップ Pro+ (Responsive)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
:root {
  --primary:#3498db;
  --bg-panel:rgba(255,255,255,0.98);
  --text-main:#2c3e50;
}

/* 全画面固定 */
html,body{
  width:100%;height:100%;margin:0;overflow:hidden;
}
#map{width:100%;height:100%;}

/* UIレイヤ */
.ui-layer{
  position:absolute;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:1000;
}
.ui-layer>*{pointer-events:auto}

/* 検索バー */
.search-container{
  position:absolute;
  top:15px;left:50%;
  transform:translateX(-50%);
  display:flex;gap:8px;
  width:90%;max-width:320px;
}
#station-query{
  flex:1;padding:12px 15px;border-radius:30px;
  border:1px solid #ccc;font-size:16px;
}
#search-btn{
  padding:0 18px;border-radius:25px;
  background:var(--primary);color:#fff;border:none;
}

/* ハンバーガーボタン */
.menu-btn{
  position:absolute;top:15px;left:15px;
  width:44px;height:44px;
  border:none;border-radius:10px;
  background:var(--primary);color:#fff;
  font-size:22px;display:none;
}

/* パネル */
.control-panel{
  position:fixed;top:80px;left:10px;
  width:280px;max-height:85vh;
  background:var(--bg-panel);
  border-radius:12px;
  box-shadow:0 4px 20px rgba(0,0,0,.15);
  display:flex;flex-direction:column;
  transition:transform .3s ease;
}

/* パネル中身 */
.panel-header{padding:12px;border-bottom:1px solid #eee}
.panel-content{padding:10px;overflow-y:auto}
.panel-footer{padding:10px;border-top:1px solid #eee}

details{margin-bottom:6px;border:1px solid #eee;border-radius:6px}
summary{padding:10px;font-weight:bold;background:#f8f9fa;cursor:pointer}
summary::-webkit-details-marker{display:none}
.child-label{display:flex;align-items:center;font-size:13px;margin:6px 0}
.dot{width:8px;height:8px;border-radius:50%;margin-right:6px}

#refresh-btn{
  width:100%;padding:14px;
  background:var(--primary);color:#fff;
  border:none;border-radius:8px;
}
#loading{font-size:12px;color:#e67e22;text-align:center;display:none}

/* ===== PC ===== */
@media(min-width:768px){
  .menu-btn{display:none}
  .control-panel{transform:none}
  .search-container{left:320px;transform:none}
}

/* ===== スマホ ===== */
@media(max-width:767px){
  .menu-btn{display:block}
  .control-panel{
    top:0;left:0;height:100%;
    width:85%;max-width:320px;
    border-radius:0;
    transform:translateX(-100%);
  }
  .control-panel.open{
    transform:translateX(0);
  }
}
</style>
</head>

<body>
<div id="map"></div>

<div class="ui-layer">
  <button id="menu-btn" class="menu-btn">☰</button>

  <div class="search-container">
    <input id="station-query" placeholder="駅名を入力">
    <button id="search-btn">検索</button>
  </div>

  <div class="control-panel">
    <div class="panel-header">
      <h3>🏠 住みやすさ設定</h3>
    </div>

    <div class="panel-content">
      <details open>
        <summary><input type="checkbox" checked class="parent-check" data-cat="food"> チェーン店</summary>
        <label class="child-label"><input type="checkbox" checked class="child-check" data-key="mcd"> <span class="dot" style="background:#d32f2f"></span> マック</label>
      </details>
    </div>

    <div class="panel-footer">
      <div id="loading">取得中...</div>
      <button id="refresh-btn">エリア内再検索</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map("map").setView([35.681,139.767],15);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"©OSM"}).addTo(map);

const layers={mcd:L.layerGroup().addTo(map)};
const config={mcd:{color:"#d32f2f",q:'node["brand"="McDonald\'s"]'}};

document.getElementById("menu-btn").onclick=()=>{
  document.querySelector(".control-panel").classList.toggle("open");
};

document.getElementById("search-btn").onclick=async()=>{
  const q=station-query.value;
  if(!q)return;
  const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`);
  const d=await r.json();
  if(d[0]) map.setView([d[0].lat,d[0].lon],15);
};

async function searchArea(){
  Object.values(layers).forEach(l=>l.clearLayers());
  const b=map.getBounds();
  const q=`[out:json];${config.mcd.q}(${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()});out;`;
  const r=await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(q)}`);
  const d=await r.json();
  d.elements.forEach(e=>{
    L.circleMarker([e.lat,e.lon],{
      radius:8,color:config.mcd.color,
      fillColor:config.mcd.color,fillOpacity:.8
    }).addTo(layers.mcd);
  });
}
document.getElementById("refresh-btn").onclick=searchArea;
searchArea();
</script>
</body>
</html>
